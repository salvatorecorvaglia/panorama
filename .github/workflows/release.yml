name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm run lint

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run Vitest tests
        run: pnpm run test

      - name: Package extension
        run: pnpm run package

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          node -e '
          const fs = require("fs");
          const tag = process.env.GITHUB_REF_NAME || "";
          const version = tag.replace(/^v/, "");
          if (fs.existsSync("CHANGELOG.md") && version) {
            const content = fs.readFileSync("CHANGELOG.md", "utf8");
            const escapedVer = version.replace(/\./g, "\\.");
            const regex = new RegExp("##\\s*\\[?v?" + escapedVer + "\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)", "i");
            const match = content.match(regex);
            if (match && match[1].trim()) {
              fs.writeFileSync("RELEASE_NOTES.md", match[1].trim());
              console.log("Extracted release notes for version " + version);
              process.exit(0);
            }
          }
          console.log("No changelog entry found for version " + version);
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Panorama ${{ github.ref_name }}
          files: '*.vsix'
          body_path: ${{ hashFiles('RELEASE_NOTES.md') != '' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

