<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#6c3ce0"/>
    </linearGradient>
    <linearGradient id="nodeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#80d8ff"/>
    </linearGradient>
    <linearGradient id="nodeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e040fb"/>
      <stop offset="100%" stop-color="#ff80ab"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="url(#bg)"/>

  <!-- Edge lines forming eye/panorama shape -->
  <g stroke-width="0.8" fill="none" opacity="0.6">
    <!-- Left side edges (cyan) -->
    <line x1="18" y1="64" x2="30" y2="46" stroke="#00d4ff"/>
    <line x1="18" y1="64" x2="30" y2="82" stroke="#00d4ff"/>
    <line x1="30" y1="46" x2="30" y2="82" stroke="#00d4ff"/>
    <line x1="30" y1="46" x2="44" y2="34" stroke="#00d4ff"/>
    <line x1="30" y1="46" x2="44" y2="56" stroke="#00d4ff"/>
    <line x1="30" y1="82" x2="44" y2="72" stroke="#00d4ff"/>
    <line x1="30" y1="82" x2="44" y2="94" stroke="#00d4ff"/>
    <line x1="44" y1="34" x2="44" y2="56" stroke="#00d4ff"/>
    <line x1="44" y1="72" x2="44" y2="94" stroke="#00d4ff"/>
    <line x1="44" y1="34" x2="58" y2="28" stroke="#b0bec5"/>
    <line x1="44" y1="56" x2="58" y2="52" stroke="#b0bec5"/>
    <line x1="44" y1="72" x2="58" y2="76" stroke="#b0bec5"/>
    <line x1="44" y1="94" x2="58" y2="100" stroke="#b0bec5"/>

    <!-- Center edges -->
    <line x1="58" y1="28" x2="70" y2="28" stroke="#b0bec5"/>
    <line x1="58" y1="52" x2="70" y2="52" stroke="#b0bec5"/>
    <line x1="58" y1="76" x2="70" y2="76" stroke="#b0bec5"/>
    <line x1="58" y1="100" x2="70" y2="100" stroke="#b0bec5"/>
    <line x1="58" y1="28" x2="64" y2="40" stroke="#b0bec5"/>
    <line x1="70" y1="28" x2="64" y2="40" stroke="#b0bec5"/>
    <line x1="58" y1="52" x2="64" y2="40" stroke="#b0bec5"/>
    <line x1="70" y1="52" x2="64" y2="40" stroke="#b0bec5"/>
    <line x1="58" y1="76" x2="64" y2="88" stroke="#b0bec5"/>
    <line x1="70" y1="76" x2="64" y2="88" stroke="#b0bec5"/>
    <line x1="58" y1="100" x2="64" y2="88" stroke="#b0bec5"/>
    <line x1="70" y1="100" x2="64" y2="88" stroke="#b0bec5"/>
    <line x1="64" y1="40" x2="64" y2="88" stroke="#b0bec5" opacity="0.4"/>

    <!-- Right side edges (pink) -->
    <line x1="70" y1="28" x2="84" y2="34" stroke="#ff6ec7"/>
    <line x1="70" y1="52" x2="84" y2="56" stroke="#ff6ec7"/>
    <line x1="70" y1="76" x2="84" y2="72" stroke="#ff6ec7"/>
    <line x1="70" y1="100" x2="84" y2="94" stroke="#ff6ec7"/>
    <line x1="84" y1="34" x2="84" y2="56" stroke="#ff6ec7"/>
    <line x1="84" y1="72" x2="84" y2="94" stroke="#ff6ec7"/>
    <line x1="84" y1="34" x2="98" y2="46" stroke="#ff6ec7"/>
    <line x1="84" y1="56" x2="98" y2="46" stroke="#ff6ec7"/>
    <line x1="84" y1="72" x2="98" y2="82" stroke="#ff6ec7"/>
    <line x1="84" y1="94" x2="98" y2="82" stroke="#ff6ec7"/>
    <line x1="98" y1="46" x2="110" y2="64" stroke="#ff6ec7"/>
    <line x1="98" y1="82" x2="110" y2="64" stroke="#ff6ec7"/>
    <line x1="98" y1="46" x2="98" y2="82" stroke="#ff6ec7"/>
  </g>

  <!-- Left nodes (cyan glow) -->
  <g filter="url(#glowCyan)">
    <circle cx="18" cy="64" r="3.5" fill="url(#nodeLeft)"/>
    <circle cx="30" cy="46" r="3" fill="url(#nodeLeft)"/>
    <circle cx="30" cy="82" r="3" fill="url(#nodeLeft)"/>
    <circle cx="44" cy="34" r="2.5" fill="url(#nodeLeft)"/>
    <circle cx="44" cy="56" r="2.5" fill="url(#nodeLeft)"/>
    <circle cx="44" cy="72" r="2.5" fill="url(#nodeLeft)"/>
    <circle cx="44" cy="94" r="2.5" fill="url(#nodeLeft)"/>
  </g>

  <!-- Center nodes (neutral) -->
  <g opacity="0.8">
    <circle cx="58" cy="28" r="2.5" fill="#b0bec5"/>
    <circle cx="70" cy="28" r="2.5" fill="#b0bec5"/>
    <circle cx="64" cy="40" r="3" fill="#e0e0e0"/>
    <circle cx="58" cy="52" r="2.5" fill="#b0bec5"/>
    <circle cx="70" cy="52" r="2.5" fill="#b0bec5"/>
    <circle cx="58" cy="76" r="2.5" fill="#b0bec5"/>
    <circle cx="70" cy="76" r="2.5" fill="#b0bec5"/>
    <circle cx="64" cy="88" r="3" fill="#e0e0e0"/>
    <circle cx="58" cy="100" r="2.5" fill="#b0bec5"/>
    <circle cx="70" cy="100" r="2.5" fill="#b0bec5"/>
  </g>

  <!-- Right nodes (pink glow) -->
  <g filter="url(#glowPink)">
    <circle cx="84" cy="34" r="2.5" fill="url(#nodeRight)"/>
    <circle cx="84" cy="56" r="2.5" fill="url(#nodeRight)"/>
    <circle cx="84" cy="72" r="2.5" fill="url(#nodeRight)"/>
    <circle cx="84" cy="94" r="2.5" fill="url(#nodeRight)"/>
    <circle cx="98" cy="46" r="3" fill="url(#nodeRight)"/>
    <circle cx="98" cy="82" r="3" fill="url(#nodeRight)"/>
    <circle cx="110" cy="64" r="3.5" fill="url(#nodeRight)"/>
  </g>
</svg>
